repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version
  rev: v0.15.15
  hooks:
    # Run the linter
    - id: ruff-check
      stages: [pre-commit]
    # Run the formatter
    - id: ruff-format
      args: [ --check ]
      stages: [pre-commit]

- repo: local
  hooks:
    - id: mypy
      name: mypy
      entry: uv run mypy .
      language: system
      types: [python]
      pass_filenames: false
      stages: [pre-commit]
