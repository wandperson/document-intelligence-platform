{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto mt-2 p-4 bg-white rounded-lg border border-gray-200 shadow-sm">
  <form
    id="upload-form"
    hx-post="/api/documents/upload"
    hx-encoding="multipart/form-data"
    hx-swap="none"
    hx-disabled-elt="#upload-btn"
    hx-on::before-request="document.getElementById('error-box').textContent = ''"
    hx-on::after-request="
      if (event.detail.successful) {
        this.reset();
        document.getElementById('file-primary-text').innerHTML = '<span class=\'text-blue-600 group-hover:underline\'>Click to upload</span>';
        document.getElementById('file-secondary-text').textContent = 'or drag & drop';
        htmx.trigger('#document-table', 'refresh');
      } else {
        document.getElementById('error-box').textContent = event.detail.xhr.responseText || 'Something went wrong...';
      }
    "
    class="space-y-4"
  >
    <div class="flex flex-col sm:flex-row gap-4 items-stretch w-full overflow-hidden">
      
      <div class="flex-1 w-full sm:max-w-[calc(50%-0.5rem)] flex flex-col min-w-0">
        <span class="block text-xs font-semibold text-gray-700 mb-1.5 uppercase tracking-wider">
          Files
        </span>
        <div class="relative flex flex-row items-center justify-center w-full flex-1 border-2 border-dashed border-gray-300 rounded-lg bg-gray-50 hover:bg-gray-100 hover:border-blue-400 transition-all p-2 text-center group overflow-hidden">
          
          <div class="flex flex-row items-center justify-center gap-3 pointer-events-none select-none w-full px-2 max-w-full overflow-hidden">
            <svg class="w-6 h-6 text-gray-400 group-hover:text-blue-500 transition-colors shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
            </svg>
            
            <div class="leading-tight text-left min-w-0 flex-1 overflow-hidden">
              <p id="file-primary-text" class="text-sm text-gray-500 font-medium truncate block w-full">
                <span class="text-blue-600 group-hover:underline">Click to upload</span>
              </p>
              <p id="file-secondary-text" class="text-xs text-gray-400 truncate block w-full">or drag & drop</p>
            </div>
          </div>

          <input
            id="file-upload"
            type="file"
            name="files"
            required
            multiple
            class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
            hx-on:change="
              document.getElementById('doc-name').value = this.files[0] ? this.files[0].name.split('.').slice(0, -1).join('.') : '';
              if (this.files.length === 1) {
                document.getElementById('file-primary-text').textContent = this.files[0].name;
                document.getElementById('file-secondary-text').textContent = '1 file selected';
              } else if (this.files.length > 1) {
                document.getElementById('file-primary-text').textContent = `${this.files.length} files selected`;
                document.getElementById('file-secondary-text').textContent = 'Ready to upload';
              } else {
                document.getElementById('file-primary-text').innerHTML = '<span class=\'text-blue-600 group-hover:underline\'>Click to upload</span>';
                document.getElementById('file-secondary-text').textContent = 'or drag & drop';
              }
            "
          >
        </div>
      </div>
      
      <div class="flex-1 w-full sm:max-w-[calc(50%-0.5rem)] flex flex-col justify-between gap-3 min-w-0">
        <div class="w-full">
          <label for="doc-name" class="block text-xs font-semibold text-gray-700 mb-1.5 uppercase tracking-wider">
            Document Name
          </label>
          <input
            type="text"
            id="doc-name"
            name="document_name"
            required
            placeholder="Enter title or select file..."
            class="doc-name-input block w-full border border-gray-300 px-3 py-2 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm h-10 transition-shadow"
          >
        </div>

        <div class="w-full relative flex items-end h-10 mt-auto">
          <button
            id="upload-btn"
            type="submit"
            class="upload-submit-btn w-full h-full px-5 py-2 bg-blue-600 text-white font-medium rounded-lg shadow-sm text-sm hover:bg-blue-700 transition-colors"
          >
            <span class="htmx-indicator-inverse">Upload</span>
            <div class="htmx-indicator flex items-center justify-center gap-2 m-auto">
              <div class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></div>
              <span>Uploading...</span>
            </div>
          </button>
        </div>
      </div>

    </div>
  </form>

  <div id="error-box" class="error-zone mt-3 p-3 bg-red-50 text-red-700 border border-red-200 rounded-lg text-sm"></div>
</div>

<div
  id="document-table"
  hx-get="/ui/documents/table"
  hx-trigger="load delay:10ms, refresh"
  hx-swap="innerHTML"
  class="mt-4"
>
</div>

<style>
  /* Form validation: disabled button if input is invalid */
  #upload-form:has(.doc-name-input:invalid) .upload-submit-btn {
    opacity: 0.5;
    pointer-events: none;
    background-color: #9ca3af;
  }

  /* Control HTMX indicator visibility */
  .htmx-indicator {
    display: none;
  }
  .htmx-request .htmx-indicator {
    display: flex;
  }
  .htmx-request .htmx-indicator-inverse {
    display: none;
  }

  /* Hide empty error block */
  .error-zone:empty {
    display: none !important;
  }

  /* Style the button during the upload request */
  .htmx-request .upload-submit-btn {
    opacity: 0.35; /* Make it look slightly less active */
    background-color: #f59e0b !important; /* Tailwind's amber-500 (yellowish tint) */
  }
</style>
{% endblock %}
