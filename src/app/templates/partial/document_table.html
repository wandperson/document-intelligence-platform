<table class="w-full bg-white rounded shadow">
    <thead>
        <tr class="text-left border-b">
            <th class="p-2"></th>
            <th class="p-2">Name</th>
            <th class="p-2">Id</th>
            <th class="p-2">Process</th>
            <th class="p-2">Created At</th>
        </tr>
    </thead>

    <tbody>
        {% for document in documents %}
        <tr class="border-b">
            <td class="p-2">
                <a href="/documents/{{ document.document_id }}"
                class="px-3 py-1 bg-blue-500 text-white rounded text-sm hover:bg-blue-600">
                    View
                </a>
            </td>
            <td class="p-2">{{ document.name }}</td>
            <td class="p-2">{{ document.document_id }}</td>
            <td class="p-2">
                <div class="flex gap-1">
                    {% for stage in document.stage_chain %}
                    <span
                        class="px-2 py-1 rounded text-xs font-bold select-none {{ stage.color }}"
                        title="{{ stage.stage_tooltip }} | {{ stage.status_tooltip }}"
                    >
                        {{ stage.label }}
                    </span>
                    {% endfor %}
                </div>
            </td>
            <td class="p-2">{{ document.created_at }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
