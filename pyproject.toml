[project]
name = "document-intelligence-platform"
version = "0.1.0"
description = "Intelligent document processing platform for OCR, translation, and document management"
readme = "README.md"
requires-python = "==3.13.12"
dependencies = [
    # Web Framework & Server
    "uvicorn[standard]>=0.48.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    # Configuration & Environment
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.14.1",
    # Request Parsing
    "python-multipart>=0.0.29",  # Handling file uploads and form-data
    "filetype>=1.2.0",  # Used to detect file types and MIME formats
    # Frontend
    "jinja2>=3.1.6",
    # Database
    "sqlalchemy>=2.0.50",
    "asyncpg>=0.31.0",
    "aiofiles>=25.1.0",
]

[dependency-groups]
# Local Development
dev = [
    { include-group = "linting" },
    { include-group = "type_checking" },
    # CI tools
    "pre-commit>=4.6.0",
]
linting = [
    "ruff>=0.15.15",
]
type-checking = [
    "mypy>=2.1.0",
]
utils = [
    "typer>=0.26.7",
]

# ============================================================
# TOOL CONFIGURATIONS (BUILD, LINTERS, CHECKERS)
# ============================================================
[tool.setuptools]
# Which packages need to be installed
packages = ["app", "scripts"]
# Where each of them is physically located
package-dir = {"app" = "src/app", "scripts" = "scripts"}

[tool.mypy]
# type checking fix for pydantic_settings initialization
plugins = ["pydantic.mypy"]

# ============================================================
# CLI ENTRY POINTS
# ============================================================
[project.scripts]
db-init = "scripts.db_init:cli"
